<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ساعاتي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0f172a">
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--gold:#fbbf24;--ok:#22c55e;--line:#334155}
@media(prefers-color-scheme:light){:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--line:#e2e8f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 14px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:8px}
.tabs button{background:none;border:1px solid var(--line);color:var(--mu);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#0f172a;border-color:var(--gold);font-weight:700}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
button.big{width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;font:inherit;font-size:20px;font-weight:700;cursor:pointer}
.go{background:var(--gold);color:#0f172a}
.pause{background:#475569;color:#fff}
.stop{background:var(--ok);color:#fff}
.row{display:flex;gap:10px}.row>*{flex:1}
.clock{font-size:56px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;direction:ltr;margin:10px 0 2px;letter-spacing:1px}
.clock.paused{color:var(--mu);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.4}}
.tname{text-align:center;font-size:20px;font-weight:700}
.place{text-align:center;color:var(--mu);font-size:14px}
.badge{display:inline-block;background:var(--gold);color:#0f172a;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
.today{display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.today b{color:var(--tx)}
.sum{display:flex;gap:10px}.sum div{flex:1;text-align:center;background:var(--bg);border-radius:12px;padding:12px}
.sum b{display:block;font-size:26px;color:var(--gold)}.sum span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-weight:600;font-size:12px}
td.n{white-space:nowrap}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:2px 6px}
.small{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.small button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);font:inherit;cursor:pointer}
.hint{font-size:12px;color:var(--mu);margin-top:10px;line-height:1.6}
.hide{display:none!important}
h3{margin:14px 0 6px;font-size:15px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(0,0,0,.55)}
@media print{.tabs,.noprint,.x,.small{display:none!important}body{background:#fff;color:#000}.card{background:#fff;border:1px solid #ccc}.sum b{color:#000}}
</style>
</head>
<body>
<main>
<h1><span>⏱ ساعاتي</span>
<span class="tabs"><button id="tT" class="on">المؤقت</button><button id="tR">التقرير</button></span></h1>

<section id="vT">
  <div id="idle" class="card">
    <label>التصنيف</label><select id="cat"></select>
    <label>المهمة</label><input id="task" list="tl" placeholder="شو رح تشتغل عليه؟" autocomplete="off">
    <label>المكان (اختياري)</label><input id="place" list="pl" placeholder="مثال: الشركة / البيت / العميل" autocomplete="off">
    <datalist id="tl"></datalist><datalist id="pl"></datalist>
    <button class="big go" id="start">▶ ابدأ</button>
  </div>

  <div id="run" class="card hide">
    <div class="tname" id="rTask"></div>
    <div class="place" id="rPlace"></div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="place" id="rState"></div>
    <div class="row">
      <button class="big pause" id="pause">⏸ استراحة</button>
      <button class="big stop" id="stop">✔ تم</button>
    </div>
  </div>

  <div class="card today"><span>اليوم</span><b id="todayTot">0س 0د</b></div>

  <div class="card noprint">
    <label>ذكّرني كل</label>
    <select id="remind"><option value="15">15 دقيقة</option><option value="30">30 دقيقة</option><option value="60">ساعة</option><option value="0">لا تذكّرني</option></select>
    <div class="hint" id="notiHint"></div>
  </div>
</section>

<section id="vR" class="hide">
  <div class="card noprint">
    <div class="row">
      <div><label>من يوم</label><input type="date" id="dFrom"></div>
      <div><label>إلى يوم</label><input type="date" id="dTo"></div>
    </div>
    <div class="small"><button id="qThis">هذا الشهر</button><button id="qPrev">الشهر الماضي</button></div>
    <div class="row">
      <div><label>التصنيف</label><select id="fcat"></select></div>
      <div><label>المكان</label><select id="fplace"></select></div>
    </div>
  </div>
  <div class="card">
    <div class="sum"><div><b id="sumT" style="font-size:18px;line-height:1.4">0</b><span id="sumD">0.00 ساعة</span></div><div><b id="sumN">0</b><span>جلسة</span></div></div>
    <h3>حسب التصنيف</h3><table id="byCat"></table>
    <h3>حسب المكان</h3><table id="byPlace"></table>
    <h3>حسب المهمة</h3><table id="byTask"></table>
  </div>
  <div class="card">
    <h3 style="margin-top:0">التفاصيل</h3><table id="det"></table>
    <div class="small"><button id="xl" style="background:var(--gold);color:#0f172a;font-weight:700;border-color:var(--gold)">⬇ تصدير Excel</button><button id="prn">🖨 طباعة / PDF</button></div>
  </div>

  <dialog id="dlg">
    <div style="font-weight:700;margin-bottom:6px">اسم ملف التقرير</div>
    <input id="fname" autocomplete="off">
    <div class="hint">يُضاف الامتداد .xlsx تلقائيًا.</div>
    <div class="small">
      <button id="dOk" style="background:var(--gold);color:#0f172a;font-weight:700;border-color:var(--gold)">تصدير</button>
      <button id="dAuto">اسم تلقائي</button>
      <button id="dNo">إلغاء</button>
    </div>
  </dialog>
  <div class="card noprint">
    <div class="small" style="margin-top:0"><button id="bk">💾 نسخة احتياطية</button><button id="rs">📂 استرجاع</button></div>
    <input type="file" id="file" accept=".json" class="hide">
    <div class="hint">بياناتك محفوظة في هذا المتصفح فقط. خذ نسخة احتياطية من وقت لآخر.</div>
  </div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const K='sa3ati.v1';
let db={log:[],run:null,remind:30,cats:['مركز الشباب','مدرسة','عمل حر'],lastCat:''};
try{const s=JSON.parse(localStorage.getItem(K));if(s)db=Object.assign(db,s)}catch(e){}
const NOCAT='بدون تصنيف';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const pad=n=>String(n).padStart(2,'0');
const hms=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const hm=ms=>{
  const t=Math.round(ms/60000);
  if(t<=0)return ms>0?'أقل من دقيقة':'0 دقيقة';
  const h=Math.floor(t/60),m=t%60;
  const H=n=>n===1?'ساعة':n===2?'ساعتان':n<=10?n+' ساعات':n+' ساعة';
  const M=n=>n===1?'دقيقة':n===2?'دقيقتان':n<=10?n+' دقائق':n+' دقيقة';
  return [h?H(h):'',m?M(m):''].filter(Boolean).join(' و');
};
const dec=ms=>(ms/3600000).toFixed(2);
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const elapsed=()=>db.run?db.run.acc+(db.run.seg?Date.now()-db.run.seg:0):0;

/* ---------- notifications ---------- */
let swReg=null;
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').then(r=>swReg=r).catch(()=>{})}
function notify(title,body,tag,loud){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const o={body,tag,icon:'icon.svg',renotify:!!loud,requireInteraction:true,silent:!loud};
  if(loud)o.vibrate=[300,150,300];
  try{ if(swReg&&swReg.showNotification)swReg.showNotification(title,o); else new Notification(title,o); }catch(e){}
}
function closeNoti(tag){
  try{ if(swReg)swReg.getNotifications({tag}).then(l=>l.forEach(n=>n.close())); }catch(e){}
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function hint(){
  const h=$('notiHint');
  if(!('Notification' in window))h.textContent='المتصفح لا يدعم الإشعارات. سيظهر الوقت في عنوان التبويب.';
  else if(Notification.permission==='denied')h.textContent='الإشعارات محجوبة. فعّلها من إعدادات الموقع في المتصفح.';
  else if(Notification.permission==='default')h.textContent='عند أول «ابدأ» سيطلب المتصفح إذن الإشعارات، وافق عليه.';
  else h.textContent='الإشعارات مفعّلة. اترك الصفحة مفتوحة في الخلفية ليصلك التذكير.';
}

/* ---------- timer ---------- */
function start(){
  const task=$('task').value.trim();
  if(!task){$('task').focus();return}
  const place=$('place').value.trim();
  const cat=$('cat').value;
  db.lastCat=cat;
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(hint);
  db.run={task,place,cat,t0:Date.now(),acc:0,seg:Date.now(),lastR:0,lastM:0};
  save();render();
}
function pause(){
  const r=db.run;if(!r)return;
  if(r.seg){r.acc+=Date.now()-r.seg;r.seg=null;r.pAt=Date.now();r.lastR=Date.now()}
  else{r.seg=Date.now();r.pAt=null;r.lastR=0}
  r.lastM=0;save();render();
}
function stop(){
  const r=db.run;if(!r)return;
  const ms=elapsed();
  db.log.push({id:Date.now(),task:r.task,place:r.place,cat:r.cat||'',start:r.t0,end:Date.now(),ms});
  db.run=null;save();
  closeNoti('run');closeNoti('remind');
  $('task').value='';
  render();
}
function tick(){
  const r=db.run;
  if(!r){document.title='ساعاتي';return}
  const e=elapsed();
  $('clock').textContent=hms(e);
  document.title=(r.seg?'▶ ':'⏸ ')+hms(e)+' · '+r.task;
  const now=Date.now();
  if(now-r.lastM>=60000){
    r.lastM=now;
    notify(r.seg?'قيد العمل: '+r.task:'استراحة: '+r.task,'مضى '+hm(e)+(r.place?' · '+r.place:''),'run',false);
  }
  const iv=db.remind*60000;
  if(iv){
    if(r.seg){
      if(now-(r.lastR||r.seg)>=iv){r.lastR=now;save();beep();notify('المهمة لسا شغالة ⏱','«'+r.task+'» مضى '+hm(e)+'. اضغط تم إذا خلصت.','remind',true)}
    }else if(now-(r.lastR||r.pAt)>=iv){
      r.lastR=now;save();beep();notify('الاستراحة طالت؟','«'+r.task+'» متوقفة مؤقتًا. كمّل أو اضغط تم.','remind',true);
    }
  }
}
function render(){
  const r=db.run;
  $('idle').classList.toggle('hide',!!r);
  $('run').classList.toggle('hide',!r);
  if(r){
    $('rTask').textContent=r.task;$('rPlace').textContent=[r.cat?'🏷 '+r.cat:'',r.place?'📍 '+r.place:''].filter(Boolean).join('  ·  ');
    $('clock').classList.toggle('paused',!r.seg);
    $('rState').innerHTML=r.seg?'<span class="badge">شغّال</span>':'<span class="badge" style="background:#475569;color:#fff">استراحة</span>';
    $('pause').textContent=r.seg?'⏸ استراحة':'▶ كمّل';
  }
  const tk=dkey(Date.now());
  const tot=db.log.filter(l=>dkey(l.start)===tk).reduce((a,l)=>a+l.ms,0)+(r&&dkey(r.t0)===tk?elapsed():0);
  $('todayTot').textContent=hm(tot);
  const uniq=k=>[...new Set(db.log.map(l=>l[k]).filter(Boolean))];
  $('tl').innerHTML=uniq('task').map(v=>`<option value="${esc(v)}">`).join('');
  $('pl').innerHTML=uniq('place').map(v=>`<option value="${esc(v)}">`).join('');
  $('remind').value=String(db.remind);
  fillCats();
  tick();
}
function fillCats(sel){
  const s=$('cat');
  const cur=sel||s.value||db.lastCat||db.cats[0];
  s.innerHTML=db.cats.map(c=>`<option ${c===cur?'selected':''}>${esc(c)}</option>`).join('')+'<option value="__new">➕ تصنيف جديد…</option>';
  if(db.cats.includes(cur))s.value=cur;
}
$('cat').onchange=e=>{
  if(e.target.value!=='__new')return;
  const n=(prompt('اسم التصنيف الجديد:')||'').trim();
  if(n&&!db.cats.includes(n)){db.cats.push(n);save()}
  fillCats(n||db.lastCat||db.cats[0]);
};
$('start').onclick=start;$('pause').onclick=pause;$('stop').onclick=stop;
$('remind').onchange=e=>{db.remind=+e.target.value;save()};
$('task').addEventListener('change',()=>{
  const t=$('task').value.trim();const l=[...db.log].reverse().find(x=>x.task===t);
  if(l&&!$('place').value)$('place').value=l.place||'';
});
$('task').addEventListener('keydown',e=>{if(e.key==='Enter')start()});

/* ---------- report ---------- */
$('tT').onclick=()=>tab('T');$('tR').onclick=()=>{tab('R');report()};
function tab(t){$('vT').classList.toggle('hide',t!=='T');$('vR').classList.toggle('hide',t!=='R');$('tT').classList.toggle('on',t==='T');$('tR').classList.toggle('on',t==='R')}
const MONTHS=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function setRange(y,m){ // m: 0-based
  $('dFrom').value=ymd(new Date(y,m,1));$('dTo').value=ymd(new Date(y,m+1,0));
  $('fcat').value='';$('fplace').value='';report();
}
{const n=new Date();$('dFrom').value=ymd(new Date(n.getFullYear(),n.getMonth(),1));$('dTo').value=ymd(new Date(n.getFullYear(),n.getMonth()+1,0))}
$('qThis').onclick=()=>{const n=new Date();setRange(n.getFullYear(),n.getMonth())};
$('qPrev').onclick=()=>{const n=new Date();setRange(n.getFullYear(),n.getMonth()-1)};
const catOf=l=>l.cat||NOCAT;
function inRange(){const f=$('dFrom').value,t=$('dTo').value;return db.log.filter(l=>{const k=dkey(l.start);return(!f||k>=f)&&(!t||k<=t)})}
function rows(){
  const c=$('fcat').value,p=$('fplace').value;
  return inRange().filter(l=>(!c||catOf(l)===c)&&(!p||l.place===p)).sort((a,b)=>a.start-b.start);
}
function group(list,fn){const o={};list.forEach(l=>{const n=fn(l)||'—';o[n]=(o[n]||0)+l.ms});return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function report(){
  const R=inRange();
  const keep=(id,vals,all)=>{const cur=$(id).value;$(id).innerHTML='<option value="">الكل</option>'+vals.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('');};
  keep('fcat',[...new Set(R.map(catOf))]);
  keep('fplace',[...new Set(R.map(l=>l.place).filter(Boolean))]);
  const L=rows(),tot=L.reduce((a,l)=>a+l.ms,0);
  $('sumT').textContent=hm(tot);$('sumD').textContent=dec(tot)+' ساعة';$('sumN').textContent=L.length;
  const tb=g=>g.length?g.map(([n,ms])=>`<tr><td>${esc(n)}</td><td class="n">${hm(ms)}</td><td class="n">${dec(ms)}</td></tr>`).join(''):'<tr><td style="color:var(--mu)">لا شيء</td></tr>';
  $('byCat').innerHTML=tb(group(L,catOf));$('byPlace').innerHTML=tb(group(L,l=>l.place));$('byTask').innerHTML=tb(group(L,l=>l.task));
  $('det').innerHTML='<tr><th>التاريخ</th><th>المهمة / التصنيف</th><th>المدة</th><th></th></tr>'+(L.length?L.map(l=>`<tr><td class="n">${dkey(l.start).slice(5)}</td><td>${esc(l.task)}<br><small style="color:var(--mu)">${esc(catOf(l))}${l.place?' · '+esc(l.place):''}</small></td><td class="n">${hm(l.ms)}</td><td class="n"><button class="x" data-e="${l.id}">✎</button><button class="x" data-d="${l.id}">🗑</button></td></tr>`).join(''):'<tr><td colspan="4" style="color:var(--mu)">لا سجلات في هذه الفترة</td></tr>');
}
$('dFrom').onchange=$('dTo').onchange=()=>{$('fcat').value='';$('fplace').value='';report()};
$('fcat').onchange=$('fplace').onchange=report;
$('det').onclick=e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset.d,ed=t.dataset.e;
  if(d&&confirm('حذف هذا السجل؟')){db.log=db.log.filter(l=>l.id!=d);save();report();render()}
  if(ed){const l=db.log.find(x=>x.id==ed);const v=prompt('عدّل المدة بالدقائق:',Math.round(l.ms/60000));
    if(v!==null&&!isNaN(+v)&&+v>=0){l.ms=Math.round(+v*60000);save();report();render()}}
};
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}

/* ---------- Excel export ---------- */
function periodLabel(){
  const f=$('dFrom').value,t=$('dTo').value;
  if(f&&t){
    const a=new Date(f+'T00:00:00'),b=new Date(t+'T00:00:00');
    const whole=a.getDate()===1&&ymd(new Date(b.getFullYear(),b.getMonth()+1,0))===t&&a.getMonth()===b.getMonth()&&a.getFullYear()===b.getFullYear();
    if(whole)return{short:MONTHS[a.getMonth()]+' '+a.getFullYear(),long:'شهر '+MONTHS[a.getMonth()]+' '+a.getFullYear()+' ('+f+' → '+t+')'};
    return{short:f+' إلى '+t,long:'من '+f+' إلى '+t};
  }
  return{short:'كل الفترات',long:'كل الفترات'};
}
function autoName(){
  const c=$('fcat').value,p=$('fplace').value;
  return 'تقرير ساعات العمل - '+periodLabel().short+(c?' - '+c:'')+(p?' - '+p:'');
}
const cleanName=s=>s.replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,' ').trim().replace(/\.xlsx$/i,'');
$('xl').onclick=()=>{
  if(!rows().length){alert('لا توجد سجلات في الفترة المحددة.');return}
  $('fname').value=autoName();$('dlg').showModal();$('fname').select();
};
$('dNo').onclick=()=>$('dlg').close();
$('dAuto').onclick=()=>{$('fname').value=autoName()};
$('dOk').onclick=async()=>{
  const name=cleanName($('fname').value)||cleanName(autoName());
  $('dlg').close();
  try{await exportXlsx(name)}catch(err){console.error(err);alert('تعذّر إنشاء ملف Excel. تأكد أن الملف exceljs.min.js موجود بجانب الصفحة.')}
};
$('fname').addEventListener('keydown',e=>{if(e.key==='Enter')$('dOk').click()});
function loadEx(){return window.ExcelJS?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='exceljs.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

async function exportXlsx(name){
  await loadEx();
  const L=rows(),tot=L.reduce((a,l)=>a+l.ms,0);
  const NAVY='FF0F172A',GOLD='FFFBBF24',SOFT='FFFEF3C7',ZEBRA='FFF1F5F9',LINE='FFCBD5E1',MUTE='FF64748B';
  const wb=new ExcelJS.Workbook();wb.creator='ساعاتي';wb.created=new Date();
  const ws=wb.addWorksheet('تقرير الساعات',{
    views:[{rightToLeft:true,showGridLines:false}],
    pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.6,header:.3,footer:.3}},
    headerFooter:{oddFooter:'&Rصفحة &P من &N'}
  });
  ws.columns=[{width:6},{width:14},{width:12},{width:36},{width:20},{width:20},{width:24},{width:12}];
  const FONT='Arial';
  const border={top:{style:'thin',color:{argb:LINE}},bottom:{style:'thin',color:{argb:LINE}},left:{style:'thin',color:{argb:LINE}},right:{style:'thin',color:{argb:LINE}}};
  const fill=c=>({type:'pattern',pattern:'solid',fgColor:{argb:c}});
  const al=(h='center')=>({horizontal:h,vertical:'middle',readingOrder:'rtl',wrapText:true});
  const style=(cell,o)=>{Object.assign(cell,{});if(o.font)cell.font={name:FONT,...o.font};if(o.fill)cell.fill=fill(o.fill);if(o.al)cell.alignment=o.al;if(o.border)cell.border=border};
  let r=1;
  // title banner
  ws.mergeCells(r,1,r,8);let c=ws.getCell(r,1);c.value='تقرير ساعات العمل';
  style(c,{font:{size:22,bold:true,color:{argb:GOLD}},fill:NAVY,al:al()});ws.getRow(r).height=44;r++;
  ws.mergeCells(r,1,r,8);c=ws.getCell(r,1);
  const fl=[];if($('fcat').value)fl.push('التصنيف: '+$('fcat').value);if($('fplace').value)fl.push('المكان: '+$('fplace').value);
  c.value='الفترة: '+periodLabel().long+(fl.length?'   |   '+fl.join('   |   '):'');
  style(c,{font:{size:12,color:{argb:'FFFFFFFF'}},fill:'FF1E293B',al:al()});ws.getRow(r).height=26;r++;
  ws.getRow(r).height=10;r++;
  // key figures
  const kv=[['إجمالي الوقت',hm(tot),null],['إجمالي الساعات (عشري)',+(tot/3600000).toFixed(2),'0.00'],['عدد الجلسات',L.length,'0']];
  kv.forEach(([k,v,fmt])=>{
    ws.mergeCells(r,1,r,3);ws.mergeCells(r,4,r,5);
    const a=ws.getCell(r,1),b=ws.getCell(r,4);a.value=k;b.value=v;
    style(a,{font:{size:12,bold:true,color:{argb:NAVY}},fill:SOFT,al:al('right'),border:1});
    style(b,{font:{size:14,bold:true,color:{argb:NAVY}},fill:'FFFFFFFF',al:al(),border:1});if(fmt)b.numFmt=fmt;
    [2,3,5].forEach(i=>{ws.getCell(r,i).border=border});
    ws.getRow(r).height=28;r++;
  });
  ws.getRow(r).height=12;r++;
  // summary tables
  const section=(title,groups)=>{
    if(!groups.length)return;
    ws.mergeCells(r,1,r,8);c=ws.getCell(r,1);c.value=title;
    style(c,{font:{size:13,bold:true,color:{argb:NAVY}},fill:GOLD,al:al('right')});ws.getRow(r).height=26;r++;
    ['البند','','','المدة','الساعات','النسبة'].forEach((h,i)=>{});
    ws.mergeCells(r,1,r,3);
    [[1,'البند'],[4,'المدة'],[5,'الساعات'],[6,'النسبة']].forEach(([i,h])=>{const x=ws.getCell(r,i);x.value=h;style(x,{font:{size:11,bold:true,color:{argb:'FFFFFFFF'}},fill:NAVY,al:al(),border:1})});
    [2,3].forEach(i=>{ws.getCell(r,i).border=border;ws.getCell(r,i).fill=fill(NAVY)});
    ws.getRow(r).height=24;r++;
    groups.forEach(([n,ms],i)=>{
      ws.mergeCells(r,1,r,3);
      const bg=i%2?ZEBRA:'FFFFFFFF';
      const cells=[[1,n,null,'right'],[4,hm(ms),null,'center'],[5,+(ms/3600000).toFixed(2),'0.00','center'],[6,tot?ms/tot:0,'0%','center']];
      cells.forEach(([ci,v,fmt,h])=>{const x=ws.getCell(r,ci);x.value=v;style(x,{font:{size:11,color:{argb:NAVY}},fill:bg,al:al(h),border:1});if(fmt)x.numFmt=fmt});
      [2,3].forEach(ci=>{ws.getCell(r,ci).border=border;ws.getCell(r,ci).fill=fill(bg)});
      ws.getRow(r).height=22;r++;
    });
    ws.getRow(r).height=12;r++;
  };
  section('الملخص حسب التصنيف',group(L,catOf));
  const pg=group(L,l=>l.place).filter(([n])=>n!=='—');if(pg.length)section('الملخص حسب المكان',pg);
  // details
  ws.mergeCells(r,1,r,8);c=ws.getCell(r,1);c.value='تفاصيل الجلسات';
  style(c,{font:{size:13,bold:true,color:{argb:NAVY}},fill:GOLD,al:al('right')});ws.getRow(r).height=26;r++;
  ['م','التاريخ','اليوم','المهمة','التصنيف','المكان','المدة','الساعات'].forEach((h,i)=>{const x=ws.getCell(r,i+1);x.value=h;style(x,{font:{size:11,bold:true,color:{argb:'FFFFFFFF'}},fill:NAVY,al:al(),border:1})});
  ws.getRow(r).height=26;const hdr=r;r++;
  const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const first=r;
  L.forEach((l,i)=>{
    const bg=i%2?ZEBRA:'FFFFFFFF';
    const vals=[i+1,new Date(dkey(l.start)+'T00:00:00'),DAYS[new Date(l.start).getDay()],l.task,catOf(l),l.place||'—',hm(l.ms),+(l.ms/3600000).toFixed(2)];
    vals.forEach((v,j)=>{const x=ws.getCell(r,j+1);x.value=v;
      style(x,{font:{size:11,color:{argb:NAVY}},fill:bg,al:al(j===3?'right':'center'),border:1});
      if(j===1)x.numFmt='yyyy-mm-dd';if(j===7)x.numFmt='0.00'});
    ws.getRow(r).height=22;r++;
  });
  // total row
  ws.mergeCells(r,1,r,6);c=ws.getCell(r,1);c.value='المجموع';
  style(c,{font:{size:12,bold:true,color:{argb:NAVY}},fill:GOLD,al:al('right'),border:1});
  [2,3,4,5,6].forEach(i=>{ws.getCell(r,i).border=border;ws.getCell(r,i).fill=fill(GOLD)});
  const g=ws.getCell(r,7);g.value=hm(tot);style(g,{font:{size:12,bold:true,color:{argb:NAVY}},fill:GOLD,al:al(),border:1});
  const h=ws.getCell(r,8);h.value={formula:`SUM(H${first}:H${r-1})`,result:+(tot/3600000).toFixed(2)};h.numFmt='0.00';
  style(h,{font:{size:12,bold:true,color:{argb:NAVY}},fill:GOLD,al:al(),border:1});
  ws.getRow(r).height=28;r++;
  ws.getRow(r).height=10;r++;
  ws.mergeCells(r,1,r,8);c=ws.getCell(r,1);
  c.value='أُنشئ بواسطة ساعاتي · '+new Date().toLocaleDateString('en-GB');
  style(c,{font:{size:10,italic:true,color:{argb:MUTE}},al:al()});
  ws.autoFilter={from:{row:hdr,column:1},to:{row:r-3,column:8}};
  const buf=await wb.xlsx.writeBuffer();
  dl(name+'.xlsx',buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
$('prn').onclick=()=>window.print();
$('bk').onclick=()=>dl('sa3ati-backup.json',JSON.stringify(db),'application/json');
$('rs').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.log))throw 0;
    if(confirm('سيتم استبدال البيانات الحالية. متابعة؟')){db=Object.assign({log:[],run:null,remind:30,cats:['مركز الشباب','مدرسة','عمل حر'],lastCat:''},d);save();render();report()}}catch(x){alert('ملف غير صالح')}};
  r.readAsText(f)};

setInterval(tick,1000);
document.addEventListener('visibilitychange',tick);
hint();render();
</script>
</body>
</html>
